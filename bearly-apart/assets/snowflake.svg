<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120">
  <!-- A six-armed snowflake for the snow day (and any scene's "rain"). -->
  <g stroke-linecap="round" fill="none">
    <g id="arm">
      <path d="M0 0V-48M0 -24L-12 -36M0 -24L12 -36M0 -38L-8 -46M0 -38L8 -46" />
    </g>
    <g stroke="#4a251f" stroke-width="11">
      <use href="#arm" /><use href="#arm" transform="rotate(60)" /><use href="#arm" transform="rotate(120)" />
      <use href="#arm" transform="rotate(180)" /><use href="#arm" transform="rotate(240)" /><use href="#arm" transform="rotate(300)" />
    </g>
    <g stroke="#ffffff" stroke-width="6">
      <use href="#arm" /><use href="#arm" transform="rotate(60)" /><use href="#arm" transform="rotate(120)" />
      <use href="#arm" transform="rotate(180)" /><use href="#arm" transform="rotate(240)" /><use href="#arm" transform="rotate(300)" />
    </g>
  </g>
  <circle r="9" fill="#ffffff" stroke="#4a251f" stroke-width="4" />
</svg>
