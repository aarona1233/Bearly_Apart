  <g class=""><g class="eye"><circle cx="96" cy="81" r="6.5" fill="#6b5040"/><circle cx="97.6" cy="79.1" r="2.145" fill="#fff"/></g><g class="eye"><circle cx="134" cy="79" r="6.5" fill="#6b5040"/><circle cx="135.6" cy="77.1" r="2.145" fill="#fff"/></g><path d="M87,70 L103,65 M127,64 L142,69" stroke="#6b5040" stroke-width="3.2" stroke-linecap="round"/><path d="M92,92 q-3,7 0,10 q3,-3 0,-10z" fill="#8fd3ff" class="drip"/></g>
