<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- A little bear in a ghost sheet: round ears, rosy cheeks, wavy hem. Drawn for Bearly Apart's Halloween mode. -->
  <defs>
    <radialGradient id="sheet" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.7" stop-color="#f3f1ff" />
      <stop offset="1" stop-color="#dcd8f5" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feColorMatrix in="blur" values="0 0 0 0 0.75  0 0 0 0 0.72  0 0 0 0 1  0 0 0 0.8 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#4b3a5a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="56" cy="54" r="21" fill="url(#sheet)" />
    <circle cx="144" cy="54" r="21" fill="url(#sheet)" />
    <path
